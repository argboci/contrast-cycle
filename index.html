<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contrast</title>
<meta name="description" content="Three free 8-week functional bodybuilding cycles with tempo supersets, workout timer, movement demos and a training log.">
<meta name="theme-color" content="#00274A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrast">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: efficy palette. Navy header bar, light body, navy text, green for large elements only, one pink accent (rest timer). */
:root{
  --efficy-green:#37B879; --efficy-green-bright:#53CF93; --efficy-green-light:#EAF3EF;
  --efficy-navy:#00274A; --efficy-pink:#FA1475; --efficy-white:#FAFFFD;
  --bg:#EAF3EF; --surface:#FAFFFD; --ink:#00274A; --muted:#4A6178; --line:#CFE0D7;
  --accent:#37B879; --accent-big:#37B879; --accent-soft:#DDEFE5; --link:#00274A;
  --bar:#00274A; --bar-ink:#FAFFFD; --chip-on:#00274A; --chip-on-ink:#FAFFFD;
  --plate:#FA1475; --ok:#37B879; --ok-ink:#00274A;
  --display:"Inter","Verdana Pro",Verdana,Arial,sans-serif;
  --body:"Inter","Verdana Pro",Verdana,Arial,sans-serif;
  --mono:"Inter","Verdana Pro",Verdana,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#001B33; --surface:#00274A; --ink:#FAFFFD; --muted:#A9BCCC; --line:#1C4266;
  --accent:#53CF93; --accent-big:#53CF93; --accent-soft:#0B3A5C; --link:#FAFFFD;
  --bar:#00274A; --bar-ink:#FAFFFD; --chip-on:#53CF93; --chip-on-ink:#00274A;
  --plate:#FA1475; --ok:#53CF93; --ok-ink:#00274A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#001B33; --surface:#00274A; --ink:#FAFFFD; --muted:#A9BCCC; --line:#1C4266;
  --accent:#53CF93; --accent-big:#53CF93; --accent-soft:#0B3A5C; --link:#FAFFFD;
  --bar:#00274A; --bar-ink:#FAFFFD; --chip-on:#53CF93; --chip-on-ink:#00274A;
  --plate:#FA1475; --ok:#53CF93; --ok-ink:#00274A; color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);
  display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:4px solid var(--efficy-green);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .back{border:1px solid rgba(250,255,253,.35);background:transparent;color:var(--bar-ink);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.top h1{font:700 20px/1.15 var(--display);margin:0;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .crumb{display:block;font:500 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#A9BCCC}
.sync{font:500 11px var(--body);color:#A9BCCC;white-space:nowrap}
.sync.ok{color:var(--efficy-green-bright)}

h2{font:700 26px/1.15 var(--display);margin:8px 0 0;text-wrap:balance}
h3{font:600 17px/1.2 var(--display);margin:0}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}

/* program cards */
.progs{display:grid;gap:12px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%}
.prog:hover{border-color:var(--accent)}
.prog .tag{font:800 40px/0.95 var(--display);color:var(--accent-big);letter-spacing:-.02em}
.prog .row{display:flex;justify-content:space-between;align-items:end;gap:12px}
.prog.new{border:2px solid var(--accent)}
.badge{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--efficy-navy);color:var(--efficy-white);padding:6px 9px;border-radius:6px;white-space:nowrap}
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--efficy-green);color:var(--efficy-navy);border-radius:12px;padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left}
.continue .eyebrow{color:var(--efficy-navy)}
.continue b{font:700 19px/1.2 var(--display)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:44px;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:700 15px/1 var(--display);cursor:pointer;display:grid;place-items:center;position:relative}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}

.note{background:var(--surface);border-left:4px solid var(--efficy-green);padding:10px 12px;border-radius:4px 10px 10px 4px;font-size:14px}
details.intro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.intro summary{cursor:pointer;font-weight:600}
details.intro ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}

.days{display:grid;gap:10px}
.dayc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.dayc .n{font:800 28px/1 var(--display);width:44px;text-align:center;color:var(--accent-big)}
.dayc .t{min-width:0}
.dayc .t b{display:block;font:600 16px/1.25 var(--display)}
.dayc .t span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done{font:600 11px var(--body);color:var(--ink);background:var(--accent-soft);padding:4px 7px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.done:empty{display:none}

/* day view */
.block{display:grid;gap:10px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border-bottom:3px solid var(--efficy-green);padding-bottom:5px}
.bhead .sub{font-size:12.5px;color:var(--muted)}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;display:grid}
.line{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.line:last-child{border-bottom:0}
.line.plain{color:var(--muted);font-style:italic}
.mv{font-weight:600;text-decoration:none;color:var(--link);border-bottom:2px solid var(--accent)}
.mv::after{content:" \2197";font-size:.8em}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}

.lift{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.lift .hd{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.code{font:700 14px/1 var(--body);background:var(--efficy-navy);color:var(--efficy-white);border-radius:6px;padding:6px 7px}
.lift .nm{font:600 16px/1.3 var(--body);min-width:0;overflow-wrap:anywhere}
.spec{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tempo{display:flex;gap:3px}
.tempo span{display:grid;justify-items:center;gap:1px}
.tempo b{font:700 16px/1 var(--body);font-variant-numeric:tabular-nums;width:26px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.tempo i{font:500 9px/1 var(--body);font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dose{font:700 17px/1 var(--display);font-variant-numeric:tabular-nums}
.dose small{font:500 12px var(--body);color:var(--muted)}
.lnote{font-size:13px;color:var(--muted)}
.last{font:500 12.5px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--ink)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center}
.set .i{font:700 14px var(--body);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 16px var(--body);font-variant-numeric:tabular-nums;padding:0 8px;text-align:center}
.set input::placeholder{color:var(--muted);font-weight:500;font-size:12px}
.tick{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.tick.on{background:var(--efficy-green);border-color:var(--efficy-green);color:var(--efficy-navy)}
.lift .acts{display:flex;justify-content:space-between;align-items:center;gap:8px}
.restbtn{border:0;background:var(--efficy-navy);color:var(--efficy-white);border-radius:8px;height:36px;padding:0 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.sessnote textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:14px var(--body);padding:10px;resize:vertical;box-sizing:border-box}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.nav2{display:flex;justify-content:space-between;gap:10px}
.nav2 button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--display);cursor:pointer}

/* timer: the page's single pink accent */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--efficy-navy);color:var(--efficy-white);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:14px;border-top:4px solid var(--efficy-green)}
.timer .clock{font:800 38px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--efficy-green-bright)}
.timer .lbl{flex:1;min-width:0;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-weight:600}
.timer .bar{position:absolute;left:0;top:-4px;height:4px;background:var(--efficy-pink);transition:width 1s linear}
.timer.end{background:var(--efficy-pink);color:var(--efficy-white);border-top-color:var(--efficy-pink)}
.timer.end .clock{color:var(--efficy-white)}
.libbtn{border:1px solid rgba(250,255,253,.35);background:transparent;color:var(--bar-ink);border-radius:8px;height:36px;padding:0 12px;font:600 13px var(--body);cursor:pointer;flex:none}
.wtbtn{margin-left:auto;border:0;background:var(--efficy-navy);color:var(--efficy-white);border-radius:8px;min-height:34px;padding:6px 12px;font:600 13px/1.2 var(--body);cursor:pointer;text-align:left;max-width:100%}
.wtbtn b{font-weight:700}
.wt{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--efficy-navy);color:var(--efficy-white);border-top:4px solid var(--efficy-green);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.wt[hidden],.timer[hidden]{display:none}
.wt .wtl{font:600 13px/1.3 var(--body);opacity:.9;min-width:0;overflow-wrap:anywhere}
.wt .wtt{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#A9BCCC}
.wt .wtc{font:800 64px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--efficy-green-bright)}
.wt.rest .wtc{color:var(--efficy-white)}
.wt .wtrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wt .wtn{font:500 12.5px var(--body);color:#A9BCCC;min-width:0;flex:1;overflow-wrap:anywhere}
.wt button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;height:40px;padding:0 14px;cursor:pointer;font-weight:600}
.wt button.main{background:var(--efficy-green);border-color:var(--efficy-green);color:var(--efficy-navy)}
.wt .flash{color:var(--efficy-pink)}
.wt.done{background:var(--efficy-green);color:var(--efficy-navy)}
.wt.done .wtc,.wt.done .wtt,.wt.done .wtn{color:var(--efficy-navy)}
.libtools{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg);padding-block:8px;z-index:4}
.libtools input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:15px var(--body);padding:0 12px;width:100%;box-sizing:border-box}
.libgrp{display:grid;gap:6px}
.libgrp h3{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--efficy-green);padding-bottom:4px}
.libgrp h3 span{font:500 12px var(--body);color:var(--muted)}
.altbtn{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;min-width:34px;height:30px;padding:0 8px;font:700 13px var(--body);cursor:pointer;vertical-align:middle;margin-left:6px}
.altbtn:hover{border-color:var(--accent)}
.lift .hd{grid-template-columns:auto 1fr auto}
.line .altbtn{height:26px;min-width:30px;font-size:12px}
.altwrap{position:fixed;inset:0;z-index:30;background:rgba(0,20,38,.55);display:flex;align-items:flex-end;justify-content:center}
.altwrap[hidden]{display:none}
.altsheet{background:var(--bg);color:var(--ink);width:100%;max-width:720px;max-height:85vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px;border-top:4px solid var(--efficy-green)}
.altsheet .ah{display:flex;justify-content:space-between;align-items:start;gap:10px}
.altsheet .ah h3{font:700 18px/1.25 var(--body)}
.altsheet .ah button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-weight:600;flex:none}
.altsheet .alist{overflow-y:auto;display:grid;gap:6px;padding-bottom:4px;min-height:0}
.altsheet .why{font-size:13px;color:var(--muted)}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.libitem a{min-width:0;overflow-wrap:anywhere}
.tags{display:flex;gap:4px;flex:none}
.tg{font:600 10px/1 var(--body);letter-spacing:.04em;padding:4px 5px;border-radius:4px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.tg.p{background:var(--efficy-navy);color:var(--efficy-white)}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.timer .bar{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back" id="backBtn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="ttl"><span class="crumb" id="crumb">8-week training cycles</span><span id="ttlText">Contrast</span></h1>
    <span class="sync" id="sync"></span>
    <button class="libbtn" id="libBtn">Library</button>
  </header>
  <main id="view" class="wrap" aria-live="polite"><p class="empty">Loading programs…</p></main>
</div>

<div class="altwrap" id="altwrap" hidden>
  <div class="altsheet" role="dialog" aria-modal="true" aria-labelledby="altTitle">
    <div class="ah"><div><p class="eyebrow">Alternatives</p><h3 id="altTitle"></h3><p class="why" id="altWhy"></p></div><button id="altClose">Close</button></div>
    <div class="chips" id="altEq"></div>
    <div class="alist" id="altList"></div>
  </div>
</div>
<div class="wt" id="wt" hidden role="timer" aria-live="polite">
  <div class="wtrow"><span class="wtt" id="wtt">Workout</span></div>
  <div class="wtl" id="wtl"></div>
  <div class="wtrow"><span class="wtc" id="wtc">0:00</span><span class="wtn" id="wtn"></span></div>
  <div class="wtrow">
    <button class="main" id="wtPause">Pause</button>
    <button id="wtRound">+1 round</button>
    <button id="wtNext">Next</button>
    <button id="wtStop">Stop</button>
  </div>
</div>
<div class="timer" id="timer" hidden>
  <div class="bar" id="tbar"></div>
  <div class="clock" id="tclock">0:00</div>
  <div class="lbl" id="tlbl">Rest</div>
  <button id="tplus">+15s</button>
  <button id="tstop">Stop</button>
</div>

<script>
const PROGS = [
  {id:'fbc3', file:'fbc3.json', short:'Contrast', name:'Contrast Cycle', blurb:'8 weeks, 5 training days. Two 4-week blocks with different exercises: tempo supersets, conditioning and finishers.'},
  {id:'found', file:'found.json', short:'Foundation', name:'Foundation Cycle', blurb:'Start here. Push / pull / legs + posterior chain, 10-12 reps, double progression, 4 days a week.', isNew:true},
  {id:'power', file:'power.json', short:'Power', name:'Power Cycle', blurb:'Strength and power. Heavy + explosive contrast pairs in 5-4-3 waves, gymnastics, sprints, 4 days a week.', isNew:true},
];
const cache = {};
const progTag = x => ({fbc1:'FBC 1', fbc2:'FBC 2', fbc3:'Contrast', found:'Foundation', power:'Power'})[x] || x;
let logs = {};            // docId -> data
let db = null, dbState = 'pending';
let draft = null, draftId = null, dirty = false, saveTimer = null, saving = Promise.resolve();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt = v => 'https://www.youtube.com/watch?v=' + v;
const dayKey = d => d === 'flow' ? 'flow' : String(d);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };

async function load(id){
  if (cache[id]) return cache[id];
  const p = PROGS.find(x => x.id === id);
  const r = await fetch(p.file); cache[id] = await r.json(); return cache[id];
}

/* ---------- routing: #home | #fbc3 | #fbc3-w2 | #fbc3-w2-d4 | #fbc3-w2-dflow ---------- */
function parseHash(){
  const h = (location.hash || '').slice(1);
  const m = h.match(/^(fbc[123]|found|power)(?:-w(\d))?(?:-d(\w+))?$/);
  if (h === 'library') return {view:'library'};
  if (!m) return {view:'home'};
  return {view: m[3] ? 'day' : 'prog', prog:m[1], week: m[2] ? +m[2] : null, day: m[3] || null};
}
function go(h){ if (location.hash === '#' + h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
$('#backBtn').addEventListener('click', () => {
  const r = parseHash();
  if (r.view === 'day') go(r.prog + '-w' + r.week); else go('home');
});

function setHeader(crumb, title, back){
  $('#crumb').textContent = crumb; $('#ttlText').textContent = title; $('#backBtn').hidden = !back;
}

async function route(){
  flushSave();
  const r = parseHash();
  window.scrollTo(0,0);
  if (r.view === 'home') return renderHome();
  if (r.view === 'library') return renderLibrary();
  const p = await load(r.prog);
  if (r.view === 'prog') return renderProg(r.prog, p, r.week || +(lsGet('wk-' + r.prog) || 1));
  return renderDay(r.prog, p, r.week, r.day);
}

/* ---------- logging helpers ---------- */
const docId = (prog, w, d) => `${prog}-w${w}-d${dayKey(d)}`;
const progIdx = id => PROGS.findIndex(p => p.id === id);
function orderKey(prog, w, d){ const di = d === 'flow' ? 2.5 : +d; return progIdx(prog)*1000 + w*10 + di; }
function hasLog(id){ const l = logs[id]; if (!l || !l.items) return false; return Object.values(l.items).some(it => (it.sets||[]).some(s => s.kg || s.reps || s.done)); }
function lastFor(name, curKey){
  let best = null;
  for (const l of Object.values(logs)){
    if (!l || !l.items || l.key >= curKey) continue;
    for (const it of Object.values(l.items)){
      if (it.name !== name) continue;
      const sets = (it.sets||[]).filter(s => s.kg || s.reps);
      if (sets.length && (!best || l.key > best.key)) best = {key:l.key, sets, label:`${PROGS[progIdx(l.prog)]?.short||''} W${l.week}`};
    }
  }
  return best;
}
function fmtSets(sets){
  const kgs = [...new Set(sets.map(s => s.kg).filter(Boolean))];
  const reps = sets.map(s => s.reps || '–').join(', ');
  return (kgs.length === 1 ? kgs[0] + ' kg × ' : kgs.length ? kgs.join('/') + ' kg × ' : '') + reps;
}
function setSync(t, ok){ const s = $('#sync'); s.textContent = t; s.classList.toggle('ok', !!ok); }

const LOGKEY = 'cc-logs';
function startDb(){
  try { logs = JSON.parse(localStorage.getItem(LOGKEY) || '{}') || {}; } catch(e) { logs = {}; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
  setSync('on this phone', true);
}
function saveLogs(){
  try { localStorage.setItem(LOGKEY, JSON.stringify(logs)); setSync('saved', true); }
  catch(e) { setSync('save failed'); }
}
function scheduleSave(){
  dirty = true; setSync('saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 900);
}
function flushSave(){
  clearTimeout(saveTimer);
  if (!dirty || !draft || !draftId) return;
  const id = draftId, body = structuredClone(draft);
  body.updatedAt = new Date().toISOString();
  dirty = false;
  logs[id] = body;
  saveLogs();
}

function importLogs(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result); const inc = data.logs || data; let n = 0;
      for (const [k, v] of Object.entries(inc)){
        if (!v || typeof v !== 'object' || !v.items) continue;
        if (!logs[k] || (v.updatedAt || '') > (logs[k].updatedAt || '')){ logs[k] = v; n++; }
      }
      saveLogs(); $('#bkMsg').textContent = `Imported ${n} session${n === 1 ? '' : 's'}.`;
    } catch(e){ $('#bkMsg').textContent = 'That file is not a Contrast Cycle backup.'; }
  };

}

function restSecs(r){ const m = String(r||'').match(/(\d+)\s*(sec|s|min|m)?/i); if (!m) return 0; return /^m/i.test(m[2]||'') ? +m[1]*60 : +m[1]; }

function refreshInputs(){
  if (!draft) return;
  document.querySelectorAll('.set input').forEach(inp => {
    if (document.activeElement === inp) return;
    const it = draft.items[inp.dataset.c]; const s = it && it.sets[+inp.dataset.s];

  });
  document.querySelectorAll('.tick').forEach(b => {
    const it = draft.items[b.dataset.c]; const s = it && it.sets[+b.dataset.s];
    b.classList.toggle('on', !!(s && s.done));
  });
  const n = $('#sessNote'); if (n && document.activeElement !== n) n.value = draft.note || '';
}
function refreshMarks(){

  const r = parseHash();
  if (r.view === 'day' && draft){
    document.querySelectorAll('[data-last]').forEach(el => {
      const last = lastFor(el.dataset.last, draft.key);

function setVal(code, si, field, val){
  const it = draft.items[code] || (draft.items[code] = {name:'', sets:[]});
  while (it.sets.length <= si) it.sets.push({});
  it.sets[si][field] = val;
}

let tEnd = 0, tTotal = 0, tInt = null, wake = null, actx = null;
function beep(){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(off => { const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.2, actx.currentTime + off); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + off + .2);
      o.start(actx.currentTime + off); o.stop(actx.currentTime + off + .21); }); } catch(e) {}
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {}
}
async function lockScreen(){ try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch(e) {} }
function startTimer(sec, lbl){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e) {}
  tTotal = sec; tEnd = Date.now() + sec*1000;
  $('#tlbl').textContent = 'Rest · ' + lbl; $('#timer').hidden = false; $('#timer').classList.remove('end');
  lockScreen(); clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.ceil((tEnd - Date.now())/1000));
  $('#tclock').textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  $('#tbar').style.width = (tTotal ? (1 - left/tTotal)*100 : 0) + '%';
  if (left === 0){ clearInterval(tInt); tInt = null; $('#timer').classList.add('end'); $('#tlbl').textContent = 'Go! Next set'; beep(); setTimeout(() => { if (!tInt) $('#timer').hidden = true; }, 6000); }
}
$('#tstop').addEventListener('click', () => { clearInterval(tInt); tInt = null; $('#timer').hidden = true; });
$('#tplus').addEventListener('click', () => { if (tInt){ tEnd += 15000; tTotal += 15; } else startTimer(15, 'extra'); });

// Workout timer parser: turns a conditioning block into a list of timer segments.
// Segment: {kind:'work'|'rest'|'watch', secs (0 for watch), label, marks:[sec], stations:[{at,label}]}
function wtParse(b){
  const lab = String(b.label || ''), sub = String(b.sub || '');
  const dupe = sub && (lab.toLowerCase().includes(sub.toLowerCase().replace(/^[a-e]\)\s*/, '')) || sub.toLowerCase().includes(lab.toLowerCase().replace(/^[a-e]\)\s*/, '')));
  const raw = [lab, dupe ? '' : sub, ...(b.items || []).map(i => i.text || '')];
  const L = raw.map(s => String(s).replace(/\s+/g, ' ').trim()).filter(Boolean);
  const low = L.map(s => s.toLowerCase());
  const segs = []; let pendingRest = 0, sets = 0, setRest = 0, forTime = false, restParts = 0;
  const num = (a, b2) => b2 ? +b2 : +a;               // range "3-4" -> upper bound
  const dur = s => { const m = s.match(/^(\d+)\s*(sec|s|min|mins|minutes?)\b/i); return m ? (/^m/i.test(m[2]) ? +m[1] * 60 : +m[1]) : 0; };
  const restOf = s => {
    const m = s.match(/rest(?: walk)?\s*(\d+)(?::(\d\d))?(?:\s*-\s*\d+)?\s*(sec|s|min|mins|minutes?)?/i);
    if (!m) return 0;
    if (m[2]) return +m[1] * 60 + +m[2];
    return /^m/i.test(m[3] || 'min') ? +m[1] * 60 : +m[1];
  };
  const stationLines = i => {   // 1st/2nd/odd/even lines after line i (until next header)
    const out = [];
    for (let k = i + 1; k < L.length; k++) {
      if (/^(every|emom|rest)\b/i.test(low[k]) || /amrap|clock/.test(low[k])) break;
      const m = L[k].match(/^(1st|2nd|3rd|4th|odd|even)\s*-?\s*(.*)$/i);
      if (m) out.push({key: m[1].toLowerCase(), text: m[2]});
    }
    return out;
  };
  const push = s => { if (pendingRest && segs.length) segs.push({kind: 'rest', secs: pendingRest, label: 'Rest'}); pendingRest = 0; segs.push(s); };
  const intervals = (every, rounds, label, i) => {
    const st = stationLines(i);
    const odd = st.filter(x => x.key === 'odd'), even = st.filter(x => x.key === 'even'), ord = st.filter(x => !/odd|even/.test(x.key));
    const group = [];
    for (let r = 0; r < rounds; r++) {
      let s = '';
      if (ord.length) { const grp = {}; ord.forEach(x => (grp[x.key] = grp[x.key] || []).push(x.text)); const keys = Object.keys(grp); s = grp[keys[r % keys.length]].join(' + '); }
      else if (odd.length || even.length) s = ((r % 2 === 0) ? odd : even).map(x => x.text).join(' + ');
      group.push({kind: 'work', secs: every, label: `${label} · round ${r + 1}/${rounds}` + (s ? ` · ${s}` : '')});
    }
    if (pendingRest && segs.length) segs.push({kind: 'rest', secs: pendingRest, label: 'Rest'}); pendingRest = 0;
    segs.push(...group);
  };
  for (let i = 0; i < L.length; i++) {
    const s = low[i]; let m;
    if ((m = s.match(/(\d+)\s*-?\s*min(?:ute)?s?\s*amrap/)) || (m = s.match(/amrap\s*(?:x\s*)?(\d+)\s*min/))) {
      push({kind: 'work', secs: +m[1] * 60, label: `AMRAP ${m[1]}:00`, amrap: true}); continue;
    }
    if ((m = s.match(/emom\s*x\s*(\d+)/))) { intervals(60, +m[1], 'EMOM', i); continue; }
    if ((m = s.match(/every\s*(\d+)\s*(sec|s|min|mins|minutes?)\s*x\s*(\d+)(?:\s*-\s*(\d+))?/))) {
      const every = /^m/.test(m[2]) ? +m[1] * 60 : +m[1];
      intervals(every, num(m[3], m[4]), `Every ${wfmt(every)}`, i); continue;
    }
    if ((m = s.match(/(\d+)\s*-?\s*min(?:ute)?s?\s*(?:clock|continuous)/)) || (m = s.match(/^(?:[a-d]\)\s*)?(\d+)\s*mins?\s*:?\s*$/))) {
      const secs = +m[1] * 60, marks = new Set(), stations = [];
      for (let k = i + 1; k < L.length; k++) {
        if (/amrap|clock|continuous|^rest\b|^-?rest\b/.test(low[k]) && k > i + 0) { if (/^-?rest\b/.test(low[k]) || /clock|continuous|amrap/.test(low[k])) break; }
        let mm;
        if ((mm = low[k].match(/every\s*(\d+)\s*min/))) for (let t = +mm[1]; t <= +m[1]; t += +mm[1]) marks.add(t * 60);
        if ((mm = low[k].match(/at (?:the )?([\d,\sand]+)\s*min/))) mm[1].split(/[^\d]+/).filter(Boolean).forEach(t => marks.add(+t * 60));
      }
      // station cycle: consecutive "1min X" lines
      const st = []; for (let k = i + 1; k < L.length; k++) { const d = dur(L[k]); if (!d || /^-?rest/.test(low[k])) break; st.push({secs: d, label: L[k]}); }
      if (st.length >= 2) { let t = 0, j = 0; while (t < secs) { stations.push({at: t, label: st[j % st.length].label}); t += st[j % st.length].secs; j++; } }
      push({kind: 'work', secs, label: `${m[1]}:00 clock`, marks: [...marks].filter(t => t < secs).sort((a, b2) => a - b2), stations}); continue;
    }
    if (/^-?\s*rest\b/.test(s) && !/as needed/.test(s)) {
      const r = restOf(s);
      if (!r) continue;
      if (/between sets|after each set|after set|between movements|between exercises/.test(s) || (/^-?rest \d+\s*(sec|s)\b/.test(s) && !segs.length && sets)) { setRest = setRest || r; continue; }
      pendingRest = r; restParts++; continue;
    }
    if (/for time/.test(s) && !/not for time/.test(s)) forTime = true;
    if (/not for time/.test(s) && segs.length) { push({kind: 'watch', secs: 0, label: 'Not for time · tap Next when done'}); continue; }
    if (!sets && (m = s.match(/^(?:[a-d]\)\s*)?(\d+)(?:\s*-\s*(\d+))?\s*(sets|rounds)\b/))) sets = num(m[1], m[2]);
  }
  // all-duration station sets (e.g. 12 Sets: 30sec Row / 30sec Walk; 2-3 Sets: 20sec plank R / 20sec L / rest 20sec ...)
  if (!segs.length && sets) {
    const items = (b.items || []).map(i => String(i.text || '').trim()).filter(t => t && !/as needed/i.test(t));
    const parts = items.map(t => /^-?rest\b/i.test(t) ? {kind: 'rest', secs: restOf(t), label: 'Rest'} : {kind: 'work', secs: dur(t), label: t});
    if (parts.length >= 1 && parts.every(p => p.secs > 0)) {
      for (let r = 0; r < sets; r++) {
        parts.forEach(p => segs.push({...p, label: p.kind === 'rest' ? 'Rest' : `Set ${r + 1}/${sets} · ${p.label}`}));
        if (r < sets - 1 && setRest) segs.push({kind: 'rest', secs: setRest, label: 'Rest'});
      }
      return finish(segs, 'intervals');
    }
  }
  // repeat a single AMRAP/clock for N sets (pre-fatigue style)
  if (segs.length === 1 && sets > 1 && segs[0].secs) {
    const one = segs[0]; segs.length = 0;
    for (let r = 0; r < sets; r++) { segs.push({...one, label: `${one.label} · set ${r + 1}/${sets}`}); if (r < sets - 1 && setRest) segs.push({kind: 'rest', secs: setRest, label: 'Rest'}); }
  }
  if (pendingRest && segs.length && segs[segs.length - 1].kind !== 'rest' && segs.some(x => x.secs)) pendingRest = 0;
  if (!segs.length) {
    // untimed: stopwatch parts separated by rests
    if (restParts) { const parts = restParts + 1; for (let p = 0; p < parts; p++) { segs.push({kind: 'watch', secs: 0, label: `${forTime ? 'For time' : 'Part'} ${p + 1}/${parts}`}); if (p < parts - 1) segs.push({kind: 'rest', secs: restFirst(L, restOf), label: 'Rest'}); } return finish(segs, forTime ? 'fortime' : 'parts', setRest); }
    return finish([{kind: 'watch', secs: 0, label: forTime ? 'For time' : (sets ? `${sets} sets` : 'Stopwatch')}], forTime ? 'fortime' : 'stopwatch', setRest);
  }
  return finish(segs, 'timed', setRest);
}
// Split a block whose items contain sub-parts "A) ...", "B) ..." into separate parses, then join.
function wtPlan(b){
  const items = b.items || [];
  const idx = items.map((it, k) => /^[a-e]\)\s/i.test(String(it.text || '').trim()) ? k : -1).filter(k => k >= 0);
  if (idx.length < 2) return wtParse(b);
  const parts = idx.map((k, j) => ({label: items[k].text, sub: '', items: items.slice(k + 1, idx[j + 1] ?? items.length)}));
  const plans = parts.map(wtParse);
  const segs = []; plans.forEach((pl, j) => pl.segs.forEach(sg => segs.push({...sg, label: (parts[j].label.match(/^[a-e]\)/i) || [''])[0] + ' ' + sg.label})));
  const total = segs.filter(s => s.secs).reduce((a, s) => a + s.secs, 0);
  return {mode: 'timed', segs, setRest: 0, total, summary: plans.map((pl, j) => (parts[j].label.match(/^[a-e]\)/i) || [''])[0] + ' ' + pl.summary).join(' → ').slice(0, 70)};
}
function restFirst(L, restOf){ for (const s of L) { if (/^-?\s*rest\b/i.test(s) && !/between sets|as needed/i.test(s)) { const r = restOf(s); if (r) return r; } } return 120; }
function wfmt(s){ s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function finish(segs, mode, setRest){
  const timed = segs.filter(s => s.secs).reduce((a, s) => a + s.secs, 0);
  let summary;
  if (mode === 'intervals') {
    const n = segs.filter(x => / · /.test(x.label) && /^Set 1\//.test(x.label)).length || 1;
    const sets = (segs.find(x => /^Set \d+\/(\d+)/.test(x.label)) || {label: 'Set 1/1'}).label.match(/\/(\d+)/)[1];
    const one = segs.slice(0, segs.findIndex(x => /^Set 2\//.test(x.label)) > 0 ? segs.findIndex(x => /^Set 2\//.test(x.label)) : segs.length);
    summary = `${sets} sets · ` + one.map(x => (x.kind === 'rest' ? 'rest ' : '') + x.secs + 's').join(' / ');
  } else if (mode === 'stopwatch' || mode === 'fortime') summary = (mode === 'fortime' ? 'For time' : 'Stopwatch') + (setRest ? ` · rest ${wfmt(setRest)}` : '');
  else {
    const parts = []; let last = null;
    for (const s of segs) {
      const k = s.kind === 'rest' ? 'rest ' + wfmt(s.secs) : s.kind === 'watch' ? 'for time' : s.label.split(' · ')[0];
      if (last && last.k === k) last.n++; else { last = {k, n: 1}; parts.push(last); }
    }
    summary = parts.map(p => p.k.startsWith('Every') || p.k === 'EMOM' ? `${p.k} ×${p.n}` : (p.n > 1 ? `${p.k} ×${p.n}` : p.k)).join(' → ');
    if (summary.length > 60) summary = summary.slice(0, 57) + '…';
  }
  return {mode, segs, setRest: setRest || 0, total: timed, summary};
}


/* ---------- workout timer ---------- */
const TIMED_SKIP = /warm/i;
let curBlocks = [];
const wt = {plan:null, i:0, segStart:0, paused:0, pausedAt:0, ready:0, int:null, rounds:0, results:[], name:'', lastBeep:-1, marksHit:new Set()};
function wtElapsed(){ return ((wt.pausedAt || Date.now()) - wt.segStart - wt.paused) / 1000; }
function wtStart(block){
  const plan = wtPlan(block);
  stopRest();
  Object.assign(wt, {plan, i:0, results:[], rounds:0, name:block.label, paused:0, pausedAt:0, lastBeep:-1, marksHit:new Set()});
  wt.ready = Date.now() + 10000;
  $('#wt').hidden = false; $('#wt').classList.remove('done','rest');
  $('#wtPause').textContent = 'Pause';
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e) {}
  lockScreen(); clearInterval(wt.int); wt.int = setInterval(wtTick, 200); wtTick();
}
function wtBegin(){ wt.segStart = Date.now(); wt.paused = 0; wt.pausedAt = 0; wt.rounds = 0; wt.lastBeep = -1; wt.marksHit = new Set(); tone(1100, .35); }
function tone(f, d){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d); o.start(); o.stop(actx.currentTime + d + .02); } catch(e) {} try { navigator.vibrate && navigator.vibrate(d > .3 ? 300 : 80); } catch(e) {} }
function wtRecord(){
  const sg = wt.plan.segs[wt.i]; if (!sg || sg.kind === 'rest') return;
  const t = wtElapsed();
  if (sg.kind === 'watch') wt.results.push(`${sg.label.replace(/ · tap Next when done/,'')}: ${wfmt(t)}` + (wt.rounds ? ` (${wt.rounds} rds)` : ''));
  else if (sg.amrap || /clock/.test(sg.label)) wt.results.push(`${sg.label}: ${wt.rounds ? wt.rounds + ' rounds' : 'done'}`);
}
function wtAdvance(){
  wtRecord();
  wt.i++;
  if (wt.i >= wt.plan.segs.length) return wtFinish();
  wtBegin();
}
function wtFinish(){
  clearInterval(wt.int); wt.int = null;
  $('#wt').classList.add('done'); $('#wt').classList.remove('rest');
  $('#wtt').textContent = 'Done'; $('#wtc').textContent = 'Done'; $('#wtl').textContent = wt.name;
  $('#wtn').textContent = wt.results.length ? 'Saved to session notes: ' + wt.results.join(' · ') : 'Nice work.';
  tone(880, .2); setTimeout(() => tone(1320, .5), 250);
  if (wt.results.length && draft){
    draft.note = (draft.note ? draft.note.trimEnd() + '\n' : '') + `${wt.name}: ${wt.results.join(' · ')}`;
    const n = $('#sessNote'); if (n) n.value = draft.note; scheduleSave();
  }
}
function wtTick(){
  const plan = wt.plan; if (!plan) return;
  if (wt.ready){
    const left = Math.ceil((wt.ready - Date.now()) / 1000);
    $('#wtt').textContent = 'Get ready'; $('#wtl').textContent = wt.name; $('#wtc').textContent = String(Math.max(0, left));
    $('#wtn').textContent = 'First: ' + plan.segs[0].label;
    if (left <= 3 && left > 0 && left !== wt.lastBeep){ wt.lastBeep = left; tone(660, .12); }
    if (left <= 0){ wt.ready = 0; wtBegin(); }
    return;
  }
  const sg = plan.segs[wt.i]; const el = wtElapsed();
  $('#wt').classList.toggle('rest', sg.kind === 'rest');
  const total = plan.segs.length;
  $('#wtt').textContent = (sg.kind === 'rest' ? 'Rest' : sg.kind === 'watch' ? 'Stopwatch' : 'Work') + (total > 1 ? ` · ${wt.i + 1}/${total}` : '');
  let label = sg.label;
  if (sg.stations && sg.stations.length){ let cur = sg.stations[0]; for (const st of sg.stations) if (st.at <= el) cur = st; label = sg.label + ' · ' + cur.label; }
  $('#wtl').textContent = label;
  const next = plan.segs[wt.i + 1];
  let note = next ? 'Next: ' + next.label : 'Last part';
  if (sg.marks && sg.marks.length){
    const nm = sg.marks.find(m => m > el); if (nm) note = `Station at ${wfmt(nm)} · ` + note;
    for (const m of sg.marks) if (el >= m && !wt.marksHit.has(m)){ wt.marksHit.add(m); tone(1320, .2); setTimeout(() => tone(1320, .2), 260); }
  }
  if (wt.rounds) note = `${wt.rounds} rounds · ` + note;
  $('#wtn').textContent = note;
  $('#wtRound').hidden = !(sg.amrap || sg.kind === 'watch' || /clock/.test(sg.label));
  $('#wtRound').textContent = wt.rounds ? `+1 round (${wt.rounds})` : '+1 round';
  $('#wtNext').textContent = sg.kind === 'watch' ? 'Done' : 'Next';
  if (sg.secs){
    const left = Math.max(0, Math.ceil(sg.secs - el));
    $('#wtc').textContent = wfmt(left);
    if (!wt.pausedAt && left <= 3 && left > 0 && left !== wt.lastBeep){ wt.lastBeep = left; tone(660, .12); }
    if (!wt.pausedAt && el >= sg.secs) wtAdvance();
  } else {
    $('#wtc').textContent = wfmt(el);
  }
}
$('#wtPause').addEventListener('click', () => {
  if (!wt.plan || !wt.int) return;
  if (wt.ready){ wt.ready = 0; wtBegin(); return; }
  if (wt.pausedAt){ wt.paused += Date.now() - wt.pausedAt; wt.pausedAt = 0; $('#wtPause').textContent = 'Pause'; }
  else { wt.pausedAt = Date.now(); $('#wtPause').textContent = 'Resume'; }
});
$('#wtNext').addEventListener('click', () => { if (!wt.int) return; if (wt.ready){ wt.ready = 0; wtBegin(); return; } if (wt.pausedAt){ wt.paused += Date.now() - wt.pausedAt; wt.pausedAt = 0; $('#wtPause').textContent = 'Pause'; } wtAdvance(); });
$('#wtRound').addEventListener('click', () => { wt.rounds++; tone(990, .08); wtTick(); });
$('#wtStop').addEventListener('click', () => {
  if (wt.int && !wt.ready){ wtRecord(); if (wt.results.length) { wtFinish(); return; } }
  clearInterval(wt.int); wt.int = null; wt.plan = null; $('#wt').hidden = true;
});
function stopRest(){ clearInterval(tInt); tInt = null; $('#timer').hidden = true; }

/* ---------- movement library ---------- */
let LIB = null, libCat = 'All', LIBV = null, altEq = 'All', altCur = null;
async function getLib(){ if (!LIB) LIB = await (await fetch('library.json')).json(); if (!LIBV){ LIBV = {}; LIB.forEach(e => { LIBV[e.v] = e; (e.x || []).forEach(x => { if (!LIBV[x]) LIBV[x] = e; }); }); } return LIB; }
const EQORDER = ['Bodyweight','Band','DB','KB','Barbell','Landmine','Rings','Bar','Parallettes','Machine','Jump rope','Plate','GHD','Sled','Med ball'];
async function showAlt(vid, name, heavy){
  await getLib();
  const me = LIBV[vid];
  $('#altTitle').textContent = name;
  $('#altwrap').hidden = false; $('#altClose').focus();
  if (!me){ $('#altWhy').textContent = 'This movement is not in the library yet.'; $('#altEq').innerHTML = ''; $('#altList').innerHTML = ''; return; }
  const all = LIB.filter(e => e.t === me.t && e !== me).sort((x, y) => (y.p.length > 0) - (x.p.length > 0) || x.n.localeCompare(y.n));
  let best = (me.a || []).map(v => LIBV[v]).filter(Boolean);
  if (heavy) best = best.slice().sort((x, y) => (y.l || 0) - (x.l || 0));
  altCur = {me, list: all, best, heavy, full: false}; altEq = 'All';
  $('#altWhy').textContent = `${me.t} · this one uses ${me.e.join(', ')}` + (heavy ? ' · heavy set: loadable options first' : '');
  drawAlt();
}
function role(e){
  if (e.e.some(x => x === 'Barbell' || x === 'Landmine')) return 'Barbell / landmine';
  if (e.e.some(x => x === 'DB' || x === 'KB')) return 'Dumbbell / kettlebell';
  if (e.e.includes('Band') || e.e.includes('Rings')) return 'Band / rings';
  return 'No equipment';
}
function altRow(e, label){
  return `<div class="libitem"><span style="min-width:0">${label ? `<span class="eyebrow" style="display:block;margin-bottom:3px">${esc(label)}</span>` : ''}<a class="mv" href="${yt(e.v)}" target="_blank" rel="noopener">${esc(e.n)}</a></span>
    <span class="tags">${e.e.slice(0, 2).map(x => `<span class="tg">${esc(x === 'Bodyweight' ? 'No kit' : x)}</span>`).join('')}${e.p.map(x => `<span class="tg p">${progTag(x)}</span>`).join('')}</span></div>`;
}
function drawAlt(){
  const {list, best, full} = altCur;
  if (!full){
    $('#altEq').innerHTML = '';
    const rows = best.map((e, i) => altRow(e, i === 0 && !altCur.heavy ? 'Closest match' : role(e))).join('');
    $('#altList').innerHTML = (best.length ? rows : '<p class="empty">No close swap for this one. See all similar movements below.</p>')
      + (list.length > best.length ? `<button class="nav2btn" id="altAll" style="height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer">Show all ${list.length} similar movements</button>` : '');
    return;
  }
  const counts = {}; list.forEach(e => e.e.forEach(x => counts[x] = (counts[x] || 0) + 1));
  const eqs = EQORDER.filter(x => counts[x]);
  $('#altEq').innerHTML = ['All', ...eqs].map(x => `<button class="chip${x === altEq ? ' on' : ''}" data-alteq="${esc(x)}">${x === 'Bodyweight' ? 'No equipment' : esc(x)} <small style="font-weight:500;opacity:.7">&nbsp;${x === 'All' ? list.length : counts[x]}</small></button>`).join('');
  const shown = list.filter(e => altEq === 'All' || e.e.includes(altEq));
  $('#altList').innerHTML = `<button id="altBest" style="height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer">&#8592; Back to best swaps</button>`
    + (shown.length ? shown.map(e => altRow(e)).join('') : '<p class="empty">No alternative with this equipment.</p>');
}
document.addEventListener('click', e => {
  if (e.target.id === 'altAll'){ altCur.full = true; drawAlt(); $('#altList').scrollTop = 0; }
  if (e.target.id === 'altBest'){ altCur.full = false; altEq = 'All'; drawAlt(); }
});
function closeAlt(){ $('#altwrap').hidden = true; }
$('#altClose').addEventListener('click', closeAlt);
$('#altwrap').addEventListener('click', e => { if (e.target.id === 'altwrap') closeAlt(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#altwrap').hidden) closeAlt(); });
document.addEventListener('click', e => { const c = e.target.closest('[data-alteq]'); if (c){ altEq = c.dataset.alteq; drawAlt(); } });
window.addEventListener('hashchange', closeAlt);
const CATS = ['Chest','Back','Shoulders','Biceps','Triceps','Quads & Single Leg','Glutes & Hamstrings','Core','Full Body & Power','Carries','Conditioning','Mobility & Crawls'];
$('#libBtn').addEventListener('click', () => go('library'));
async function renderLibrary(){
  setHeader('Movement library', 'Library', true);
  if (!LIB){ $('#view').innerHTML = '<p class="empty">Loading library…</p>'; await getLib(); }
  const counts = {}; LIB.forEach(e => counts[e.c] = (counts[e.c] || 0) + 1);
  $('#view').innerHTML = `
    <div class="libtools">
      <input id="libq" type="search" placeholder="Search ${LIB.length} movements" aria-label="Search movements" value="${esc(lsGet('libq') || '')}">
      <div class="chips" id="libcats">${['All', ...CATS].map(c => `<button class="chip${c === libCat ? ' on' : ''}" data-cat="${esc(c)}">${esc(c)}${c !== 'All' ? ` <small style="font-weight:500;opacity:.7">&nbsp;${counts[c] || 0}</small>` : ''}</button>`).join('')}</div>
    </div>
    <div id="liblist" class="wrap"></div>
    <p class="legend">Navy tags: used in that cycle. Light tag: playlist on the Marcus Filly / Functional Bodybuilding YouTube channels.</p>`;
  drawLib();
}
function drawLib(){
  const q = ($('#libq') ? $('#libq').value : '').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const hit = LIB.filter(e => (libCat === 'All' || e.c === libCat) && words.every(w => e.n.toLowerCase().includes(w)));
  const groups = CATS.map(c => [c, hit.filter(e => e.c === c)]).filter(g => g[1].length);
  $('#liblist').innerHTML = groups.length ? groups.map(([c, list]) => `
    <section class="libgrp"><h3>${esc(c)} <span>${list.length}</span></h3>
      ${list.slice(0, 400).map(e => `<div class="libitem"><a class="mv" href="${yt(e.v)}" target="_blank" rel="noopener">${esc(e.n)}</a>
        <span class="tags">${e.p.map(x => `<span class="tg p">${progTag(x)}</span>`).join('')}${!e.p.length && e.s[0] ? `<span class="tg">${esc(e.s[0])}</span>` : ''}</span></div>`).join('')}
    </section>`).join('') : '<p class="empty">No movement matches. Try fewer words.</p>';
}
document.addEventListener('input', e => { if (e.target.id === 'libq'){ lsSet('libq', e.target.value); drawLib(); } });
document.addEventListener('click', e => { const c = e.target.closest('[data-cat]'); if (c){ libCat = c.dataset.cat; document.querySelectorAll('#libcats .chip').forEach(x => x.classList.toggle('on', x === c)); drawLib(); } });

startDb();
route();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
